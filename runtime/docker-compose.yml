# 配布用スタック: AnythingLLM + Ollama (Docker サービス)
#
# 起動: docker compose up -d
# 初回モデルダウンロード:
#   docker compose exec ollama ollama pull llama3.1:8b
#   docker compose exec ollama ollama pull mxbai-embed-large:latest
#
# ホスト Ollama (127.0.0.1:11434) が起動中の場合は停止してから本 compose を使うこと。
# 開発環境で共存する場合: Docker Ollama は ports: "11435:11434" で別ポートに出す。

networks:
  rag-internal:
    # LLM/embedding/vectorDB の内部通信。外部公開しない。
    internal: true
  rag-public:
    # AnythingLLM の UI ポート (3001) だけ外部に出す。

services:
  ollama:
    image: ollama/ollama:latest
    pull_policy: never
    container_name: rag-ollama
    networks:
      - rag-internal
    # 開発環境でホスト Ollama (11434) と共存する場合は下行を有効化:
    # ports:
    #   - "11435:11434"
    environment:
      # モデルを一定時間後にVRAMからアンロードしない (デフォルト5分でアンロードされ次リクエストが遅い)
      - OLLAMA_KEEP_ALIVE=24h
      # 同時リクエスト処理数=1(直列)。単一ユーザーのデスクトップ製品前提。
      # 4にするとKVキャッシュを4倍確保し gemma4:12b の実行時VRAMが約15.6GBに膨らみ
      # 16GB GPUに載らずCPUへ転落する(2026-07-14検証)。上げる場合はVRAMを要確認。
      - OLLAMA_NUM_PARALLEL=1
      # HuggingFace Hub へのアクセスを禁止 (セキュリティ: モデルコードのリモートDL防止)
      - HF_HUB_OFFLINE=1
    volumes:
      - ./ollama-models:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  anythingllm:
    # localRAG 改修版 (外部LLM provider allowlist 等) をソースからビルドしたカスタム image。
    # ビルド: cd anything-llm && docker build --network=host -t localrag-anythingllm:1.0.7 -f docker/Dockerfile .
    # (WSL2のDNS不調時は --add-host=github.com:<IP> 等を追加。docs/HANDOFF.md [B3]参照。
    #  2026-07-18は github.com/api.github.com/objects.githubusercontent.com/registry.npmjs.org 等
    #  計7ホストの固定が必要だった)
    image: localrag-anythingllm:1.0.7
    pull_policy: never
    container_name: anythingllm
    networks:
      - rag-internal
      - rag-public
    ports:
      - "3001:3001"
    cap_add:
      - SYS_ADMIN
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - STORAGE_DIR=/app/server/storage
      # === セキュリティ既定値 (顧客配布制約 / OFFLINE_DISTRIBUTION_HARDENING_PLAN §6) ===
      # サーバーの既定バインド先はコード側で127.0.0.1(LAN越しの到達を遮断、2026-07-15
      # APIキー漏洩脆弱性の修正)。Dockerはホストへポート公開(3001:3001)するため
      # コンテナのeth0で listen する必要があり明示的に0.0.0.0にする。
      # collector(同一コンテナ内, 8888)はserver->collector間もloopback通信のみなので
      # 未設定のまま127.0.0.1既定を使う。
      - SERVER_HOST=0.0.0.0
      # Telemetry OFF
      - DISABLE_TELEMETRY=true
      # Swagger API ドキュメント (/api/docs) を無効化 (攻撃面の縮小)
      - DISABLE_SWAGGER_DOCS=true
      # ワークスペース誤削除防止 (顧客文書・ベクターの保護)
      - WORKSPACE_DELETION_PROTECTION=1
      - WORKSPACE_DEFAULT_TOP_N=8
      # 日本語bi-gram BM25 + dense を RRF融合するハイブリッド検索。
      # 2026-07-14/15の検証で検索漏れ2件が解消(retrieval 2/2)、E2E 11/11・文書外5/5維持を確認し既定ONに確定。
      # 残る回答失敗はLLM(gemma4)の抽出問題で検索方式に依らない。詳細: docs/HYBRID_SEARCH_LINUX_VERIFY_RESULT_2026-07-15.md
      - LANCE_HYBRID_SEARCH=true
      # --- チャンク単位のクロスエンコーダ再順位付け(既定OFF・意図的に未設定) ---------
      # LANCE_HYBRID_RERANK:
      #   RRF融合後・topN切り捨て前に bge-reranker-v2-m3 でチャンクを再順位付けする。
      #   upstream は `if (rerank) … else if (hybridSearchEnabled)` の排他分岐で、
      #   LANCE_HYBRID_SEARCH=true の既定ではチャンク単位のリランクが一度も走らない。
      #   2026-07-27 の実測(docs/HYBRID_RERANK_2026-07-27.md):
      #     K=32 で 平均 anchor_coverage@8 0.646 → 0.723(退行ゼロ・Q02が0.33→1.00)、
      #     hakusho-eval 29/30 維持、複雑20問の決定的要素 49/79 → 50/79(差は誤差範囲)。
      #     ただし**1問あたりのレイテンシが中央値 約7秒 → 約12秒**に増える(CPU ONNX)。
      #   K=50 は retrieval では最高(0.745)だが hakusho 29/30 → **27/30 に退行**したため不可。
      #   → 効果は検索層で確認済み、生成層では未証明。**2026-07-27 ユーザー判断でONに確定。**
      #     判定根拠: 2026-07-26に「Phase B以降は retrieval 指標を主・generation 指標を従(退行監視)」
      #     と事前に決めていた規則に従った(生成側は n=20 で検出力不足と実測済みのため)。
      - LANCE_HYBRID_RERANK=true
      # LANCE_HYBRID_CANDIDATE_LIMIT:
      #   RRFに渡す候補プールK。未設定なら従来どおり topN×4(20〜50でクランプ／topN=8なら32)。
      #   掃引用。上げすぎると悪化する実証あり(arXiv:2411.11767)。実測でも K=50 で退行した。
      #   **未設定のままにすること**(既定の topN×4=32 が唯一のPareto最適点。K=50は退行)。
      # - LANCE_HYBRID_CANDIDATE_LIMIT=32
      # 文抽出クッション(retrieval後にbge-rerankerv2-m3で質問関連文に絞る)。
      # 2026-07-16のフェア再検証で有効と確定: baseline 18〜19 → cushion 24〜25(+6〜7)、
      # c)定義カテゴリ2/6→6/6満点。量子化int8(既定 model_quantized.onnx)で十分で、
      # fp16との差は無かった(fp16はサイズ2倍レイテンシ2.4倍で見返りゼロ)。
      # 詳細: docs/RAG_SENTENCE_CUSHION_FAIR_REEVAL_2026-07-15.md
      # ※重要: この設定を実際に効かせるにはimage再ビルドが必須(1.0.5にはlance/cushion未搭載)。
      - LANCE_SENTENCE_CUSHION=true
      # P1: 拒否前の自動言い換え再検索(query reformulation)。検索が弱いとき(0件/dense実スコア無し/
      # 最高スコアが閾値未満)だけ、質問を公式語彙へ1回言い換えて再検索し結果を統合する。口語・省略・
      # 通称の質問が本文の公式語彙に届かない語彙ギャップを補う(実測:曖昧版Q4「三文書っていつ決まった？」
      # 最高score0.401→言い換えで日付チャンクをscore0.672で取得)。非破壊(元の検索結果は減らさない)。
      # 閾値は QUERY_REFORMULATION_MIN_SCORE で調整可(既定0.45)。詳細: docs/HANDOFF.md P1。
      - QUERY_REFORMULATION=true
      # PDF抽出時に、置換文字(U+FFFD)の連なりを「…」(U+2026)へ畳む(collector側)。
      # pdfjs-dist@4.4.168 が目次のリーダー罫線(点線)をU+FFFDとして返す不具合の緩和。
      # 当該フォントは /ToUnicode を持ち PyMuPDF は同ページを「…」で正しく返すため、
      # 失われている情報は「点線」だけである(docs/EXCLUSION_FIELD_AND_MOJIBAKE_2026-07-27.md)。
      # 🔴 **コード側の既定はOFF**。2026-07-27の実測で退行したため(下記)、意図的に無効。
      #   平均 anchor_coverage@8 0.7228 → 0.6965 / hakusho-eval 29/30 → 28/30(2run一致)。
      #   U+FFFDは3,782→0で狙いどおり消えたが、目次5ページが3,489字短くなり
      #   **チャンク分割の位相が物理ページ5〜27でずれた**ことによる移動(Q15が1.00→0.50)。
      #   S21(印刷目次パーサ)が `…` を必要とするため実装は残してある。
      #   有効化するときは true を設定し**対象文書を再取り込み**すること
      #   (埋め込み済みチャンクは再取り込みしない限り変わらない)。
      # 実測: docs/MOJIBAKE_FIX_2026-07-27.md
      # - PDF_MOJIBAKE_TO_ELLIPSIS=true
      # リランカー。2026-08-04 に BAAI（中国系）の bge-reranker-v2-m3 から
      # hotchpotch/japanese-reranker-xsmall-v2（MIT、日本発の系譜のみ）へ差し替えた。
      # 詳細: docs/RERANKER_SWAP_2026-08-04.md
      # 🔴 製品既定（linux-native/package/config/server.env.template）と揃えてある。
      #    ここを未設定にすると開発機だけ旧モデルを読み、評価が製品と食い違う。
      #    リランカーは失敗時に静かに元順序へフォールバックするので、気付けない。
      - RERANKER_MODEL_PREF=hotchpotch/japanese-reranker-xsmall-v2
      # リランカー精度。既定=量子化int8(model_quantized.onnx, 37MB)。int8で十分と確定済み。
      # RERANKER_QUANTIZED=false にすると非量子化 model.onnx を読むが、同梱していないため既定のまま。
      # --- 以下は「意図的に未設定」で無効化される項目 (値を設定しないこと) ---
      # COMMUNITY_HUB_BUNDLE_DOWNLOADS_ENABLED:
      #   未設定 = Community Hub からの bundle/Agent Skill DL を完全拒否 (422)。
      #   "false" 等を設定すると逆に verified public アイテムのDLを許可してしまうため設定禁止。
      #   (参照: server/utils/middleware/communityHubDownloadsEnabled.js)
      # AGENT_*_API_KEY (SerpAPI, Tavily, Bing 等の外部 Web 検索):
      #   未設定 = 外部 Web 検索 Agent は API キーが無く機能しない (外部通信が発生しない)。
      # LLM: Docker 内部ネットワーク経由で Ollama に接続
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434
      - OLLAMA_MODEL_PREF=gemma4:12b
      - OLLAMA_MODEL_TOKEN_LIMIT=8192
      # gemma4のthinkingを無効化(think:false)。temp=0でthinkingが反復暴走し最終回答(content)が
      # 空になる「空回答」対策＋約40倍高速化(実測20.8s→0.5s)。2026-07-21のA/Bで採用確定:
      # think OFF+P1で ambiguous 15/15+15/15(満点・2回完全一致で決定的)・空回答ゼロ、hakusho 27〜28/30
      # (think ON基準26/30を上回る)。詳細: docs/GEMMA4_EMPTY_ANSWER_INVESTIGATION_2026-07-21.md
      - OLLAMA_DISABLE_THINKING=true
      # llm-jp-4-8b-thinking 用タイムアウト(20分)。2026-07-04: GPU(RTX 5070 Ti)ではウォーム時1〜7秒で応答することを
      # 生Ollama呼び出しで確認したが、RAGコンテキスト付きの長いプロンプトでの余裕を見て有効化しておく。
      - OLLAMA_RESPONSE_TIMEOUT=1200000
      # Embedding: bge-m3 (多言語, 8192token) を Ollama 経由で使用。
      # チャンク上限500字。1000字やtopN増は防衛白書の検証(2026-07-14)で改善せず、当たる事実が入替わるだけだった。
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://ollama:11434
      - EMBEDDING_MODEL_PREF=bge-m3:latest
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=500
    volumes:
      - ./anythingllm-storage:/app/server/storage
    restart: unless-stopped

